# Překlad aplikace RoverGnss po každém pushi do main (a ručně: Actions → Build APK → Run workflow).
# Výsledek: Actions → poslední běh → Artifacts → RoverGnss-<verze>.zip (uvnitř APK).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Překlad (debug APK)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verze
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RoverGnss-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
